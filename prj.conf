# CONFIG_EARLY_CONSOLE=y

CONFIG_NETWORKING=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10
CONFIG_NET_DHCPV4=y

CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n

CONFIG_NET_TCP=y

CONFIG_NET_LOG=y
CONFIG_INIT_STACKS=y

CONFIG_NET_SHELL=y

# CONFIG_NET_STATISTICS=y
# CONFIG_NET_STATISTICS_PERIODIC_OUTPUT=n

CONFIG_WIFI=y
CONFIG_WIFI_LOG_LEVEL_ERR=y
CONFIG_NET_L2_WIFI_SHELL=y
# printing of scan results puts pressure on queues in new locking
# design in net_mgmt. So, use a higher timeout for a crowded
# environment.
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Enable wifi statistics
CONFIG_NET_STATISTICS_WIFI=y
CONFIG_NET_STATISTICS_USER_API=y

# Wi-Fi Credentials Storage & Auto-Connect
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Issue related: <err> esp32c5_wifi_adapter: memory allocation failed
# CONFIG_HEAP_MEM_POOL_SIZE=61440 (new value in MCP)

### 
# ZBUS
###
CONFIG_ZBUS=y

### 
# LED Strip
###
CONFIG_LOG=y
CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y

###
# MCP
###
# MCP Server library
CONFIG_MCP_SERVER=y
CONFIG_MCP_MAX_TOOLS=4
CONFIG_MCP_REQUEST_WORKERS=2
CONFIG_MCP_SERVER_INFO_TITLE=y
CONFIG_MCP_SERVER_INFO_INSTRUCTIONS=n
CONFIG_MCP_TOOL_DESC=y
CONFIG_MCP_TOOL_TITLE=y
CONFIG_MCP_TOOL_OUTPUT_SCHEMA=n
CONFIG_MCP_TOOL_NAME_MAX_LEN=32
CONFIG_MCP_TOOL_SCHEMA_MAX_LEN=512
CONFIG_MCP_TOOL_INPUT_ARGS_MAX_LEN=512
CONFIG_MCP_TOOL_RESULT_MAX_LEN=256
CONFIG_MCP_LOG_LEVEL_DBG=y

# # RNG configuration
CONFIG_TEST_RANDOM_GENERATOR=y

# # Network configuration
# CONFIG_NETWORKING=y
# CONFIG_NET_IPV4=y
### CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
# CONFIG_NET_DHCPV4=y

# # mDNS configs
CONFIG_MDNS_RESPONDER=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="mcp-hello-world"

# # MCP HTTP server
CONFIG_MCP_HTTP_LOG_ADDRESS=y
CONFIG_MCP_HTTP_PORT=8080
CONFIG_MCP_HTTP_ENDPOINT="/mcp"
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
CONFIG_HTTP_SERVER_MAX_STREAMS=3
CONFIG_HTTP_SERVER_MAX_HEADER_LEN=38

# # General configs
# CONFIG_HEAP_MEM_POOL_SIZE=65536
# CONFIG_HEAP_MEM_POOL_SIZE=81920
CONFIG_HEAP_MEM_POOL_SIZE=73728
CONFIG_KERNEL_MEM_POOL=y

CONFIG_MAIN_STACK_SIZE=4096
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096 (move to optimization)
# CONFIG_LOG_MODE_IMMEDIATE=y

## Test Thread Analyzer
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_AUTO=y
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=10

## Optimization
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
