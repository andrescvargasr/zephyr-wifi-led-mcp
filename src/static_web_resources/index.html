<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C5 LED Control Center</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for futuristic high-tech styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="control-container">
        <header class="header">
            <div class="logo-area">
                <svg class="chip-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="5" y="5" width="14" height="14" rx="2"></rect>
                    <path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"></path>
                    <path d="M9 9h6v6H9z" fill="currentColor" fill-opacity="0.2"></path>
                </svg>
                <div class="title-group">
                    <h1>ESP32-C5</h1>
                    <p class="subtitle">IoT LED Controller</p>
                </div>
            </div>
            <div class="status-badge" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-text">Simulating</span>
            </div>
        </header>

        <!-- Dynamic Preview Section -->
        <section class="preview-card">
            <div class="led-preview-container">
                <div class="led-halo" id="led-halo"></div>
                <div class="led-lens" id="led-lens"></div>
            </div>
            <div class="color-display-value">
                <span id="rgb-text">rgb(0, 0, 0)</span>
                <span id="hex-text">#000000</span>
            </div>
        </section>

        <!-- Controls Section -->
        <section class="controls-card">
            <!-- Mode Selector / Rainbow -->
            <div class="control-group mode-toggle-group">
                <div class="label-with-badge">
                    <h2>Operation Mode</h2>
                    <span class="badge" id="mode-badge">Static</span>
                </div>
                <button class="rainbow-btn" id="rainbow-toggle">
                    <span class="rainbow-btn-glow"></span>
                    <span class="rainbow-btn-content">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                            <path d="M12 12v9M8 17h8"></path>
                        </svg>
                        Rainbow Mode
                    </span>
                </button>
            </div>

            <!-- RGB Sliders -->
            <div class="control-group sliders-group" id="sliders-panel">
                <h2>RGB Precision Sliders</h2>
                
                <div class="slider-row red-row">
                    <div class="slider-info">
                        <label for="slider-r">Red</label>
                        <span class="val-display" id="val-r">0</span>
                    </div>
                    <input type="range" id="slider-r" min="0" max="255" value="0" class="range-slider">
                </div>

                <div class="slider-row green-row">
                    <div class="slider-info">
                        <label for="slider-g">Green</label>
                        <span class="val-display" id="val-g">0</span>
                    </div>
                    <input type="range" id="slider-g" min="0" max="255" value="0" class="range-slider">
                </div>

                <div class="slider-row blue-row">
                    <div class="slider-info">
                        <label for="slider-b">Blue</label>
                        <span class="val-display" id="val-b">0</span>
                    </div>
                    <input type="range" id="slider-b" min="0" max="255" value="0" class="range-slider">
                </div>
            </div>

            <!-- Color Palette / Presets -->
            <div class="control-group presets-group">
                <div class="label-with-picker">
                    <h2>Color Presets</h2>
                    <label class="custom-color-picker" title="Custom Color Picker">
                        <input type="color" id="color-picker" value="#000000">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.32454 18.0673 6.27581 17.4138 7.4 17.4138H9.33103C10.5186 17.4138 11.4828 16.4497 11.4828 15.2621V13.8138C11.4828 12.6262 12.4469 11.6621 13.6345 11.6621H16.0483C17.2359 11.6621 18.2 10.6979 18.2 9.51034V8.54483C18.2 6.1669 16.2779 4.24483 13.9 4.24483C11.5221 4.24483 9.6 6.1669 9.6 8.54483"></path>
                        </svg>
                    </label>
                </div>
                
                <div class="preset-grid">
                    <button class="preset-btn" data-color="#ff0000" style="--preset-color: #ff0000;">
                        <span class="preset-dot"></span> Red
                    </button>
                    <button class="preset-btn" data-color="#00ff00" style="--preset-color: #00ff00;">
                        <span class="preset-dot"></span> Green
                    </button>
                    <button class="preset-btn" data-color="#0000ff" style="--preset-color: #0000ff;">
                        <span class="preset-dot"></span> Blue
                    </button>
                    <button class="preset-btn" data-color="#00ffff" style="--preset-color: #00ffff;">
                        <span class="preset-dot"></span> Cyan
                    </button>
                    <button class="preset-btn" data-color="#ff00ff" style="--preset-color: #ff00ff;">
                        <span class="preset-dot"></span> Magenta
                    </button>
                    <button class="preset-btn" data-color="#ffff00" style="--preset-color: #ffff00;">
                        <span class="preset-dot"></span> Yellow
                    </button>
                    <button class="preset-btn" data-color="#ffffff" style="--preset-color: #ffffff;">
                        <span class="preset-dot"></span> White
                    </button>
                    <button class="preset-btn off-btn" data-color="#000000" style="--preset-color: #333333;">
                        <span class="preset-dot"></span> Off
                    </button>
                </div>
            </div>
        </section>

        <!-- Developer Log Console -->
        <section class="console-card">
            <div class="console-header" id="console-toggle">
                <div class="console-title">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="4 17 10 11 4 5"></polyline>
                        <line x1="12" y1="19" x2="20" y2="19"></line>
                    </svg>
                    <span>Developer API Console</span>
                </div>
                <div class="console-actions">
                    <span class="console-arrow">▼</span>
                </div>
            </div>
            <div class="console-body" id="console-logs">
                <div class="log-line system-log">[SYS] Initializing LED Control Interface...</div>
                <div class="log-line system-log">[SYS] API Mode: Query parameters (?r=R&g=G&b=B&rainbow=X)</div>
            </div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
